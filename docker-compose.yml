volumes:
  mongo_data:
  mlflow_data:
services:
  api-fastapi:
    build:
      context: ./api-base-fastapi
      dockerfile: Dockerfile
    volumes:
      - /tmp:/tmp
    ports: 
      - "8000:8000"
    #depends-on:
    # - mongo
  api-github:
    build:
      context: ./api-github
      dockerfile: Dockerfile
    volumes:
      - /tmp:/tmp
    ports:
      - "7000:7000"
  mongodb:
    image: mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    ports:
      - "8001:8001"
    command: ["mongod", "--port", "8001"]

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 8001
      ME_CONFIG_BASICAUTH: false
  kafka:
    image: apache/kafka:latest
    restart: always
    ports:
      - "8082:8082"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    restart: always
    ports:
      - "8083:8083"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:8083
      - MLFLOW_ARTIFACT_URI=./mlruns
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "8083"]
  mlflow-serving:
    image: ghcr.io/mlflow/mlflow:v2.20.2
    restart: always
    ports:
      - "8084:8084"
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:8083
      - MODEL_NAME=${MODEL_NAME}
    command: ["/bin/sh", "-c", "mlflow models serve -m models:/$MODEL_NAME/1 --port 8084 --no-conda"]

